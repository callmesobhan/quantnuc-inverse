[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "quantnuc-inverse"
version = "0.3.0"
description = "Quantitative PET/SPECT Image-Formation, Partial-Volume (PVE), PSF-Gibbs, Retrospective N=1 Cross-Scanner Translation & Fisher-Optimal Theranostic Dosimetry Engine (Non-Commercial Research & Personal Use Only)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
authors = [
    { name = "Sobhan Shahbazi" },
    { name = "quantnuc-inverse Contributors" },
]
keywords = [
    "nuclear-medicine",
    "pet",
    "spect",
    "partial-volume-correction",
    "earl-harmonization",
    "cross-scanner-translation",
    "theranostics-dosimetry",
    "medical-physics",
    "inverse-problems",
    "sobol-sensitivity",
    "dicom",
    "mcp",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: Other/Proprietary License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps.",
    "Topic :: Scientific/Engineering :: Physics",
]
dependencies = [
    "numpy>=1.26.0",
    "scipy>=1.13.0",
    "pydantic>=2.7.0",
    "pydicom>=2.4.0",
    "matplotlib>=3.8.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.6.0",
]

[project.scripts]
quantnuc = "quantnuc_inverse.cli:main"
quantnuc-mcp = "quantnuc_inverse.harness.mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/quantnuc_inverse"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "error",
]

[tool.coverage.run]
source = ["src/quantnuc_inverse"]
branch = true

[tool.coverage.report]
show_missing = true
precision = 2

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "NPY"]
ignore = ["E501"]
